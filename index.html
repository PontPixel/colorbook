<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>ColorFind</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --wall:#f4f5f8; --panel:#fff; --ink:#1f2330; --muted:#80869a; --line:#e3e6ec; --track:#e8eaef;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.07);
  /* UI is black and white on purpose: all color belongs to the game itself */
  --ok:var(--ink); --warn:var(--ink); --accent:var(--ink); --gold:var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font:500 15px/1.4 "Inter",system-ui,sans-serif;
  padding-inline:16px;padding-block:16px 28px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandname{font:800 16px/1 "Inter",system-ui,sans-serif;letter-spacing:-.2px}
.titlebar{text-align:center;display:flex;flex-direction:column;gap:4px}
h1{font:800 26px/1.15 "Inter",system-ui,sans-serif;margin:0;letter-spacing:-.4px}
h1 .tstars{color:var(--gold);font-size:.85em;letter-spacing:1px;margin-left:6px;white-space:nowrap}
h1 .tstars .off{color:var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:30px;width:auto;mix-blend-mode:multiply;transform:rotate(-4deg);flex:none}
.sub{color:var(--muted);font-size:14px}
.levels{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.lvl{appearance:none;flex:1 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 12px;font:600 13px "Inter",system-ui,sans-serif;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.lvl[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.lvl:disabled{opacity:.45;cursor:default}
.lvl .st{color:var(--gold);font-size:11px;letter-spacing:1px}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pill{font:700 13px "Inter",system-ui,sans-serif;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.paintgauge{display:flex;align-items:center;gap:8px;font:600 13px "Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.paintgauge .bar{height:6px}
.paintgauge .bar i{background:var(--accent)}
.frame{background:#fff;border-radius:22px;padding:8px;box-shadow:var(--shadow)}
svg.scene{display:block;width:100%;height:auto;border-radius:15px}
.credit{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px;min-height:16px}
.credit i{font-style:italic}
.credit:empty{display:none}
#game .credit{display:none} /* art credit shows on the result card instead, to keep the play screen on one phone screen */
.region{cursor:pointer;transition:fill .7s ease,stroke .7s ease}
.region.sel{animation:pulse 1.1s ease-in-out infinite}
.region.sel:not(.done){fill-opacity:.9}
.region.done{cursor:default}
@keyframes pulse{50%{filter:brightness(.94)}}
.selOutline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;pointer-events:none;animation:dash 1s linear infinite}
.selOutline.thick{stroke-dasharray:none;opacity:.35;animation:none}
@keyframes dash{to{stroke-dashoffset:-22}}
.crack{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;pointer-events:none;transition:opacity .5s}
.crack.gone{opacity:0}
.mixer{background:var(--panel);border-radius:22px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.swatches{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:10px}
.sw .lab{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4a5061}
.chip{width:100%;max-width:132px;aspect-ratio:1;border-radius:50%;border:7px solid #fff;box-shadow:0 0 0 1px var(--line),0 6px 16px rgba(20,24,40,.12),inset 0 2px 6px rgba(0,0,0,.08);transition:background .25s}
.chip.empty{background:radial-gradient(circle at 50% 35%,#f1f2f5,#dfe1e6)}
.chip.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.target-name{font:700 18px "Inter",system-ui,sans-serif;text-align:center}
.eq{display:none}
.meter{display:flex;align-items:center;gap:14px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--warn);transition:width .3s,background .3s}
.pct{display:flex;flex-direction:column;align-items:flex-end;line-height:1;min-width:58px;font-variant-numeric:tabular-nums}
.pct b{font:800 22px "Inter",system-ui,sans-serif}
.pct small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4a5061;margin-top:3px}
.drops{display:flex;flex-wrap:wrap;gap:5px;min-height:18px;justify-content:center}
.drops span{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 1px rgba(20,24,40,.18)}
.drops em{font-style:normal;color:var(--muted);font-size:13px}
.paints{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:6px;padding:12px 6px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.paint{appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:600 12px "Inter",system-ui,sans-serif;color:#4a5061}
/* Flat paint dots: plain color, no gloss or shadow. White gets a hairline so it shows on the white panel. */
.paint .blob{width:100%;max-width:48px;aspect-ratio:1;border-radius:50%;transition:transform .1s}
.paint[data-k="W"] .blob{box-shadow:inset 0 0 0 1.5px #d6d9e1}
.paint{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;left:0;top:0;width:48px;height:48px;border-radius:50%;pointer-events:none;z-index:8;box-shadow:0 10px 24px rgba(20,24,40,.25);opacity:.95}
.ghost.white{box-shadow:inset 0 0 0 1.5px #d6d9e1,0 10px 24px rgba(20,24,40,.25)}
.chip.dropping{transform:scale(1.12);box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(20,24,40,.12)}
.chip{transition:background .25s,transform .15s,box-shadow .15s}
.paint:active .blob{transform:scale(.9)}
.paint:focus-visible .blob,.btn:focus-visible,.lvl:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.actions{display:flex;gap:6px;align-items:center}
.actions .btn{flex:1 1 0;min-width:0;position:relative}
.actions .btn.primary{flex:1.5 1 0}
.btn.boost{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;font:600 12px "Inter",system-ui,sans-serif;background:none;border:0;box-shadow:none;color:#4a5061}
.btn.boost .ico{width:46px;height:46px;padding:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line),0 3px 10px rgba(20,24,40,.1);color:var(--ink);transition:transform .1s}
.btn.boost:active{transform:none}.btn.boost:active .ico{transform:scale(.92)}
.btn.boost.on .ico{background:var(--accent);color:#fff}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.locked{color:var(--muted)}
.btn.locked .ico{background:#f1f2f5;box-shadow:0 0 0 1px var(--line);color:var(--muted)}
.btn.locked:active{transform:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(20,24,40,.2);vertical-align:-2px}
.card .booster .ico{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.badge{position:absolute;top:-6px;left:calc(50% + 10px);background:var(--gold);color:#fff;border:2px solid #fff;border-radius:99px;padding:0 6px;font:700 11px/16px "Inter",system-ui,sans-serif;white-space:nowrap;display:flex;align-items:center;gap:3px}
.badge.buy{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn.on:not(.boost){background:var(--accent);color:#fff}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:#fff;border:1.5px solid var(--ink);box-shadow:inset 0 0 0 1.5px #fff,inset 0 0 0 2.6px var(--ink);vertical-align:-2px;flex:none}
.badge .coin{width:10px;height:10px;border-width:1.2px;box-shadow:inset 0 0 0 1.2px #fff,inset 0 0 0 2.1px var(--ink)}
.pill.coins{display:flex;align-items:center;gap:6px}
.pill.tier{background:var(--ink);border-color:var(--ink);color:#fff;font-size:12px;padding:5px 10px}
.gtier{font-style:normal;font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.pill.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.15)}}
.drops.picking span{cursor:pointer;animation:wig .5s ease-in-out infinite;outline:2px dashed var(--accent);outline-offset:2px}
@keyframes wig{50%{transform:rotate(-45deg) scale(1.2)}}
.card .booster{background:var(--wall);border:0;border-radius:14px;padding:10px;text-align:left;font-size:14px}
.card .booster b{font-weight:700}
.card .col{display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:12px 14px;font:700 15px "Inter",system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 6px rgba(20,24,40,.06);transition:transform .1s,background .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary.ready{background:var(--ok);border-color:var(--ok)}
.actions .btn.primary{align-self:stretch;margin-bottom:17px}
.msg{min-height:20px;text-align:center;font-weight:600;font-size:14px;color:var(--muted)}
.msg.good{color:var(--ok)} .msg.bad{color:var(--warn)}
.hint{display:none;justify-content:center;gap:6px;align-items:center;font-size:13px;color:var(--muted);text-align:center}
.hint.on{display:flex}
.overlay{position:fixed;inset:0;background:rgba(20,24,40,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlay[hidden]{display:none}
.card{background:var(--panel);border-radius:26px;padding:26px 22px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(20,24,40,.25);display:flex;flex-direction:column;gap:12px}
.card h2{font:800 23px "Inter",system-ui,sans-serif;margin:0;letter-spacing:-.3px}
.card p{margin:0;color:var(--muted)}
.card .stars{font-size:28px;letter-spacing:2px;color:var(--gold)}
.card .row{display:flex;gap:8px}.card .row .btn{flex:1}
.toast{position:fixed;z-index:7;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font:600 14px "Inter",system-ui,sans-serif;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Forced-undo coach */
.coachDim{position:fixed;inset:0;background:rgba(20,24,40,.55);z-index:4}
.coachTip{position:relative;z-index:5;background:#fff;border-radius:16px;padding:12px 14px;font-weight:600;font-size:14px;text-align:center;box-shadow:var(--shadow)}
.coachTip.nudge{animation:shake .4s}
.lift{position:relative;z-index:5;background:var(--panel);border-radius:16px;padding:8px}
.actions .btn.coach{z-index:5}.actions .btn.coach .ico{animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 1px var(--line),0 0 0 0 rgba(31,35,48,.55)}100%{box-shadow:0 0 0 1px var(--line),0 0 0 16px rgba(31,35,48,0)}}
/* Challenge */
.chbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font:600 14px "Inter",system-ui,sans-serif;text-align:center}
.share{display:flex;flex-direction:column;gap:8px}
.share input{font:600 15px "Inter",system-ui,sans-serif;border:1px solid var(--line);border-radius:99px;padding:9px 12px;text-align:center;background:#fff;color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff}
.card .note{font-size:14px;color:var(--ink);font-weight:700}
/* Celebration */
.frame{position:relative;transition:border-color .5s,box-shadow .5s}
.frame.celebrate{box-shadow:0 0 0 3px var(--ink),0 0 0 9px rgba(31,35,48,.08);animation:framepop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes framepop{40%{transform:scale(1.035)}}
.region.flash{animation:flash .7s ease both}
@keyframes flash{35%{filter:brightness(1.45) saturate(1.4)}}
.shine{animation:shine 1.3s .2s ease-in-out both}
@keyframes shine{from{transform:translateX(0) skewX(-20deg)}to{transform:translateX(600px) skewX(-20deg)}}
.spark{fill:#fff;stroke:var(--gold);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:twinkle 1.1s ease-in-out 2 both}
@keyframes twinkle{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.3) rotate(90deg)}100%{transform:scale(0) rotate(180deg)}}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg);font:700 32px/1 "Inter",system-ui,sans-serif;color:var(--ink);border:4px solid var(--ink);border-radius:10px;padding:8px 18px;letter-spacing:4px;text-transform:uppercase;background:rgba(255,255,255,.8);pointer-events:none;animation:stamp .45s cubic-bezier(.2,1.8,.5,1) both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-10deg) scale(3);opacity:0}}
.stars span{display:inline-block;animation:starpop .55s cubic-bezier(.2,1.8,.5,1) both}
.stars span.off{color:var(--line)}
@keyframes starpop{from{transform:scale(0) rotate(-120deg);opacity:0}}
.overlay:not([hidden]) .card{animation:cardin .45s cubic-bezier(.2,1.4,.5,1)}
@keyframes cardin{from{transform:translateY(40px) scale(.9);opacity:0}}
.overlay.low{align-items:flex-end;background:rgba(20,24,40,.12);-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
/* ---------- Scenes ---------- */
.iconbtn{appearance:none;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(20,24,40,.06)}
.iconbtn .ico{width:20px;height:20px}
.card .row .btn.iconbtn{flex:none;width:48px;height:auto}
/* Home */
.home{max-width:520px;margin:0 auto;min-height:calc(100dvh - 44px);display:flex;flex-direction:column;gap:12px;padding-bottom:84px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.homeMain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.homeMain .logo{height:clamp(110px,19dvh,190px);width:auto;mix-blend-mode:multiply;transform:rotate(-4deg);margin-bottom:6px}
.nextPic{appearance:none;border:0;padding:8px;background:#fff;border-radius:22px;box-shadow:var(--shadow);width:min(100%,340px,calc((100dvh - 470px) * 4 / 3 + 16px));min-width:200px;cursor:pointer}
.nextPic svg,.gcard svg{display:block;width:100%;height:auto;border-radius:15px;pointer-events:none}
.nextLabel{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.nextTitle{font:800 28px/1.1 "Inter",system-ui,sans-serif;letter-spacing:-.5px}
.nextTitle .tstars{color:var(--gold);font-size:.7em;margin-left:6px;letter-spacing:1px}.nextTitle .off{color:var(--line)}
.btn.play{background:var(--accent);border-color:var(--accent);color:#fff;font-size:20px;padding:16px;width:min(100%,320px);margin-top:8px;box-shadow:0 8px 20px rgba(20,24,40,.22)}
.home .chbar{max-width:340px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:3}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 26px;border-radius:14px;font:600 12px "Inter",system-ui,sans-serif;color:var(--muted);cursor:pointer}
.tab[aria-current="true"]{color:var(--ink);background:var(--wall)}
.gallery h2{font:800 24px "Inter",system-ui,sans-serif;margin:6px 0 2px;letter-spacing:-.4px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{appearance:none;border:0;background:#fff;border-radius:18px;padding:6px 6px 10px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;position:relative}
.gcard b{font-size:14px;padding:0 4px}.gcard small{padding:0 4px;color:var(--gold);letter-spacing:1px;min-height:16px}.gcard small .off{color:var(--line)}
.gcard:disabled{cursor:default}.gcard:disabled>svg{opacity:.35;filter:grayscale(1)}
.gcard .lockico{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:var(--shadow);color:var(--muted)}
/* Game: compact bar + compact mixer so it all fits a phone screen */
#game{gap:8px}
.gamebar{display:flex;align-items:center;gap:10px}
.gamebar .paintgauge{flex:1}
.mixer{padding:12px;gap:8px}
.swatches{grid-template-columns:1fr 1fr;align-items:start;gap:12px}
.sw{gap:6px}
.chip{max-width:84px;border-width:6px}
.target-name{font-size:16px;line-height:1.2}
.mixer .meter{display:block;padding:0 4px}
.mixer .meter .bar{height:8px}
.drops{gap:4px;min-height:16px}.drops span{width:12px;height:12px}.drops em{font-size:13px}
.msg{font-size:13px;min-height:18px}
.paints{padding:8px 4px;gap:4px}
.paint{font-size:12px;gap:6px}
.paint .blob{max-width:50px}
.btn.boost .ico{width:46px;height:46px;padding:12px}
.btn.boost{font-size:12px;gap:4px}
/* Boosters get their own evenly spaced row (painting happens automatically on a match) */
.actions{flex-direction:column;align-items:stretch;gap:12px}
.boosters{display:flex;justify-content:space-around;padding-top:8px}
.boosters .btn.boost{flex:0 0 64px;position:relative}
.actions .btn.primary{flex:none;margin:0;padding:13px;font-size:16px}
body:has(#game:not([hidden])){padding-bottom:12px}
.stamp{font-size:26px}
/* Taller phones get the full-size controls */
@media (min-height:760px) and (max-width:899px){.mixer{padding:18px 14px;gap:14px}.chip{max-width:116px}.paint .blob{max-width:56px}.btn.boost .ico{width:52px;height:52px;padding:14px}}
@media (max-height:640px){.frame{padding:5px;border-radius:18px}.chip{max-width:84px}.paint .blob{max-width:42px}.btn.boost .ico{width:42px;height:42px;padding:10px}}
/* Layout: stacked on phones, side by side on wide landscape screens */
.board,.stage{display:flex;flex-direction:column;gap:12px}
@media (min-width:900px) and (orientation:landscape){
  body{padding-block:20px}
  .wrap{max-width:1240px;gap:14px}
  .board{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
  /* keep the whole picture on screen: 4:3 picture, header + title + level bar + hud take ~250px */
  .stage{width:100%;max-width:calc((100vh - 110px) * 4 / 3);justify-self:center;min-width:420px}
  .chip{max-width:116px}
  .home{max-width:1000px}
  .gallery .ggrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .mixer{position:sticky;top:16px}
  /* result card sits over the mixer, so the restored picture stays in view */
  .overlay.low{align-items:center;justify-content:flex-end;padding-right:max(16px,calc((100vw - 1240px) / 2 + 36px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Home (menu) scene -->
<main class="home" id="home">
  <div class="topbar">
    <div class="pill" id="homeStars">★ 0</div>
    <div class="pill coins"><span class="coin"></span><span class="coinCount">0</span></div>
  </div>
  <section class="homeMain" id="homeMain">

const KAN=(()=>{
  const tiles=[[0,3,6,2],[1,4,5,6],[2,7,0,3],[5,4,6,1],[0,2,6,7],[1,3,5,6]], out=Array.from({length:8},()=>'');
  tiles.forEach((t,i)=>{
    const x=4+(i%3)*105, y=4+Math.floor(i/3)*117, cx=x+51, cy=y+56;
    out[t[0]]+=holeRect(x,y,102,113,cx,cy,46); out[t[1]]+=ring(cx,cy,46,31); out[t[2]]+=ring(cx,cy,31,15); out[t[3]]+=`<circle cx="${cx}" cy="${cy}" r="15"/>`;
  });
  return out;
})();
// Klee: a 5×4 mosaic of warm blocks
const KLEE=(()=>{
  const g=['CDBCF','BADEB','DFABC','AECAD'], out={};
  g.forEach((row,r)=>[...row].forEach((k,c)=>{out[k]=(out[k]||'')+`<rect x="${c*64}" y="${r*60}" width="64" height="60"/>`;}));
  return out;
})();
const HEAD=(cx,cy,r)=>{let s='';for(let i=0;i<12;i++){const a=i/12*Math.PI*2;s+=`<ellipse cx="${(cx+Math.cos(a)*r*.72).toFixed(1)}" cy="${(cy+Math.sin(a)*r*.72).toFixed(1)}" rx="${(r*.36).toFixed(1)}" ry="${(r*.2).toFixed(1)}" transform="rotate(${(a*180/Math.PI).toFixed(0)} ${(cx+Math.cos(a)*r*.72).toFixed(1)} ${(cy+Math.sin(a)*r*.72).toFixed(1)})"/>`;}return s;};

const LEVEL_ORDER=['balloons','fruit','malevich','beach','mondrian','house','kandinsky','redfuji','shelf','klee','starry','monet','scream','wave','sunflowers'];

// Tier = paint slack (budget / sum of recipe sizes) and coin multiplier.
const TIERS={easy:{ratio:1.8,mult:1,label:''},normal:{ratio:1.45,mult:1,label:''},hard:{ratio:1.25,mult:2,label:'Hard'},nightmare:{ratio:1.12,mult:3,label:'Nightmare'}};
LEVELS.forEach(L=>{
  L.regions.forEach(r=>{r.target=mix(r.recipe);r.min=Object.values(r.recipe).reduce((a,b)=>a+b,0);});
  L.tier=L.tier||'normal';
  if(!L.budget) L.budget=Math.ceil(L.regions.reduce((a,r)=>a+r.min,0)*TIERS[L.tier].ratio);
});

// A challenge link looks like ?c=<level id>&s=<stars to beat>&n=<friend's name>
(function readChallenge(){
  let q; try{q=new URLSearchParams(location.search);}catch(e){return;}
  const c=q.get('c'), sc=parseInt(q.get('s'),10);
  if(!c||!LEVELS.some(l=>l.id===c)||!(sc>=0&&sc<=999)) return;
  save.challenge={level:c,score:sc,from:(q.get('n')||'A friend').trim().slice(0,16)||'A friend',fresh:true}; persist();
  try{history.replaceState(null,'',location.pathname);}catch(e){}
})();

// ---------- Menu scene: home (next picture + Play) and gallery (replay any picture) ----------
const starRow=b=>[0,1,2].map(i=>`<span class="${i<b?'':'off'}">★</span>`).join('');
function thumbSVG(lv,colored){
  const byId=Object.fromEntries(lv.regions.map(r=>[r.id,r]));
  const reg=r=>r.stroke
    ?`<g fill="none" stroke="${colored?hex(r.target):BLANK_STROKE}" stroke-width="${r.stroke}" stroke-linecap="round">${r.svg}</g>`
    :`<g fill="${colored?hex(r.target):BLANK}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round">${r.svg}</g>`;
  return `<svg viewBox="0 0 320 240" aria-hidden="true">${lv.bg||''}${lv.order.map(id=>reg(byId[id])).join('')}${lv.decor}</svg>`;
}
// Next picture to play: first unfinished one, or the challenged one if it is unlocked.
function nextIndex(){
  if(save.challenge){const ci=LEVELS.findIndex(l=>l.id===save.challenge.level); if(ci>=0&&unlocked(ci)) return ci;}
  const i=LEVELS.findIndex(l=>save.best[l.id]==null);
  return i<0?LEVELS.length-1:i;
}
function renderMenu(){
  const i=nextIndex(), lv=LEVELS[i], b=save.best[lv.id], allDone=LEVELS.every(l=>save.best[l.id]!=null);
  $('nextPic').innerHTML=thumbSVG(lv,false);
  $('nextLabel').textContent=allDone&&!save.challenge?'All pictures restored':`Picture ${i+1} of ${LEVELS.length}`+(TIERS[lv.tier].label?` · ${TIERS[lv.tier].label}`:'');
  $('nextTitle').innerHTML=esc(lv.title)+(b!=null?`<span class="tstars">${starRow(b)}</span>`:'');
  $('playBtn').textContent=b!=null?'Play again':'Play';
  $('homeStars').textContent='★ '+LEVELS.reduce((a,l)=>a+(save.best[l.id]||0),0);
  const ch=save.challenge; $('homeCh').hidden=!ch;
  if(ch){const cl=LEVELS.find(l=>l.id===ch.level);$('homeCh').textContent=`🏆 ${ch.from} challenged you on ${cl.title}. Beat ${ch.score}★.`;}
  $('ggrid').innerHTML=LEVELS.map((l,k)=>{const bb=save.best[l.id], ok=unlocked(k);
    return `<button class="gcard" data-i="${k}" ${ok?'':'disabled'} aria-label="${esc(l.title)}${ok?'':', locked'}">${thumbSVG(l,bb!=null)}${ok?'':`<span class="lockico">${icon('lock')}</span>`}<b>${k+1}. ${esc(l.title)}${TIERS[l.tier].label?` <em class="gtier">${TIERS[l.tier].label}</em>`:''}</b><small>${bb!=null?starRow(bb):''}</small></button>`;}).join('');
  renderCoins();
}
function showTab(t){
  $('homeMain').hidden=t!=='home'; $('gallery').hidden=t!=='gallery';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===t));
}
function goHome(tab){
  state=null; parts=[]; hideCoach();
  ['endOverlay','introOverlay','quitOverlay'].forEach(id=>$(id).hidden=true);
  $('game').hidden=true; $('home').hidden=false;
  renderMenu(); showTab(tab||'home'); scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>{
  b.innerHTML=icon(b.dataset.tab)+(b.dataset.tab==='home'?'Home':'Gallery');
  b.onclick=()=>showTab(b.dataset.tab);
});
$('playBtn').onclick=$('nextPic').onclick=()=>start(nextIndex());
$('ggrid').addEventListener('click',e=>{const c=e.target.closest('.gcard');if(c&&!c.disabled)start(+c.dataset.i);});
$('backBtn').innerHTML=icon('back'); $('endHomeBtn').innerHTML=icon('home');
$('backBtn').onclick=()=>{

function showIntro(){

  fresh.forEach(b=>save.inv[b]=FREE_BOOSTERS);

  const chal=save.challenge&&save.challenge.fresh?save.challenge:null;

  $('introText').innerHTML=tip?tip.text:'';

    html+=`<div class="booster">🏆 Restore <b>${LEVELS[ci].title}</b> with more than <b>${chal.score}★</b>.`+

function regionEl(r){

}
function buildScene(){

const current=()=>L.regions.find(x=>x.id===state.sel);

function counts(){const c={};state.drops.forEach(k=>c[k]=(c[k]||0)+1);return c;}
const sumStars=()=>Object.values(state.stars).reduce((a,b)=>a+b,0);

function renderMix(override){
  const m=mix(counts()),chip=$('mixChip'),r=current();

  const p=m?matchPct(m,r.target):0;

function advice(m,t){
  const dl=lab(m)[0]-lab(t)[0];
  const hasBW=!L.paints||L.paints.includes('W');
  if(dl>10) return hasBW?'Too light. Add color or a touch of black.':'Not quite. Check which paints the target needs.';
  if(dl<-10) return hasBW?'Too dark. Try adding white.':'Not quite. Check which paints the target needs.';
  return 'Brightness is close. The hue is off.';
}
// Hint = only the next useful step toward the recipe, given what is already in the bowl.
function nextHint(){
  const r=current(), c=counts();
  const bad=Object.keys(c).find(k=>!r.recipe[k]);
  if(bad) return {k:bad,remove:true};
  let m=1; for(const k in c) m=Math.max(m,Math.ceil(c[k]/r.recipe[k]));
  let best=null,d=0; for(const k in r.recipe){const def=m*r.recipe[k]-(c[k]||0); if(def>d){d=def;best=k;}}
  return best?{k:best}:{done:true};
}
function renderHint(){
  const h=state.hintMsg, el=$('hint');

  if(h) el.innerHTML=h.done?'Hint: your mix is right.'
    :h.remove?`Hint: take out the <span class="dot" style="background:${hex(PMAP[h.k].rgb)}"></span> <b>${PMAP[h.k].name}</b>. ${current().name} has none.`
    :`Hint: add <span class="dot" style="background:${hex(PMAP[h.k].rgb)}"></span> <b>${PMAP[h.k].name}</b> next.`;

}
function renderActions(){

    btn.innerHTML=icon(locked?'lock':b)+`<span>${locked?'Pic '+(lv+1):BOOSTERS[b].name}</span>`+badge;
    btn.title=locked?`${BOOSTERS[b].name} unlocks in picture ${lv+1}: ${LEVELS[lv].title}`:BOOSTERS[b].text;
    btn.setAttribute('aria-label',locked?`${BOOSTERS[b].name}, locked until picture ${lv+1}`:`${BOOSTERS[b].name}, ${n?n+' left':BOOSTERS[b].price+' coins'}`);

function updateHud(){

    bar.textContent=L.id===ch.level?`🏆 Beat ${ch.from}: ${ch.score}★  ·  You: ${sumStars()}★`:`🏆 ${ch.from} challenged you on ${lv.title}. Beat ${ch.score}★ there.`;}

function renderCoins(bump){

function addCoins(n){save.coins+=n; if(n>0) state.earned+=n; persist(); renderCoins(true);}
function isLocked(b){

// Use one booster from the inventory, or buy it with coins when the inventory is empty.
function canUse(b){return save.inv[b]>0||save.coins>=BOOSTERS[b].price;}
function spend(b){
  if(save.inv[b]>0){save.inv[b]--;persist();}
  else if(save.coins>=BOOSTERS[b].price){addCoins(-BOOSTERS[b].price);toast(`${BOOSTERS[b].name} bought for ${BOOSTERS[b].price} coins`);}
  else{toast(`${BOOSTERS[b].name} costs ${BOOSTERS[b].price} coins. You have ${save.coins}.`);return false;}

function refundDrop(){state.paint++; state.used[state.sel]--; updateHud();}

// ---------- Forced free Undo (first wrong color on the picture that introduces Undo) ----------
function forceUndo(k){

$('coachDim').onclick=nudge;

// ---------- Input ----------
function addDrop(k){
  if(!state||state.finished||state.applying) return false;
  if(state.forced){nudge();return false;}
  if(state.paint<=0){outOfPaint();return false;}
  if(state.drops.length>=12){renderMix(['The bowl is full. Take drops out or empty it.','bad']);return false;}
  state.picking=false; state.hintMsg=null;
  state.drops.push(k); state.paint--; state.used[state.sel]=(state.used[state.sel]||0)+1;
  updateHud(); renderHint(); renderMix();
  if(L.intro==='undo'&&!save.tut.undo&&!current().recipe[k]) forceUndo(k);
  else afterMixChange();
  return true;
}
// No Paint it button: a mix that reaches 95% paints the part by itself after a short beat.
function afterMixChange(){
  const m=mix(counts()); if(!m||state.finished||state.forced) return;
  if(matchPct(m,current().target)>=95){
    state.applying=true; const st=state;
    setTimeout(()=>{ if(state!==st) return; state.applying=false; apply(); },500);
  }else if(state.paint<=0&&!canUse('undo')&&!canUse('pick')&&!canUse('empty')){
    setTimeout(outOfPaint,900); // nothing left to fix the mix with
  }

let dragged=false; // set when a press turned into a drag, so the click that follows is ignored
$('paints').addEventListener('click',e=>{
  const b=e.target.closest('.paint'); if(!b) return;
  if(dragged){dragged=false;return;}
  addDrop(b.dataset.k);
});
// Drag and drop: press a paint, drag it onto the mix circle, let go to add a drop. A short press stays a tap.
(function(){
  let d=null;
  const overMix=(x,y)=>{const r=$('mixChip').getBoundingClientRect(),m=28;return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m;};
  $('paints').addEventListener('pointerdown',e=>{
    const b=e.target.closest('.paint'); if(!b||!state||state.finished||state.forced||e.button>0) return;
    d={k:b.dataset.k,x:e.clientX,y:e.clientY,ghost:null,id:e.pointerId}; dragged=false;
  });
  addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id) return;
    if(!d.ghost){
      if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<8) return;
      dragged=true;
      d.ghost=document.createElement('div'); d.ghost.className='ghost'+(d.k==='W'?' white':'');
      d.ghost.style.background=hex(PMAP[d.k].rgb); document.body.appendChild(d.ghost);
    }
    d.ghost.style.transform=`translate(${e.clientX-24}px,${e.clientY-24}px)`;
    $('mixChip').classList.toggle('dropping',overMix(e.clientX,e.clientY));
  });
  const end=e=>{
    if(!d||e.pointerId!==d.id) return;
    const g=d.ghost, k=d.k; d=null; $('mixChip').classList.remove('dropping');
    if(!g) return;
    g.remove();
    if(e.type==='pointerup'&&overMix(e.clientX,e.clientY)&&addDrop(k)){
      const r=$('mixChip').getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height/2,[hex(PMAP[k].rgb),hex(PMAP[k].rgb),'#ffffff'],12,{speed:4,size:3.5,decay:.035,gravity:.1});
    }
    setTimeout(()=>{dragged=false;},0);
  };
  addEventListener('pointerup',end); addEventListener('pointercancel',end);
})();
$('emptyBtn').onclick=()=>{
  if(state.applying||isLocked('empty')||!state.drops.length) return;
  const n=state.drops.length; state.drops=[]; state.hintMsg=null;
  if(!canUse('empty')){renderHint();renderMix([`Bowl poured out. ${n} drop${n>1?'s':''} of paint lost. An Empty booster gives the paint back.`,'bad']);return;}
  spend('empty'); state.paint+=n; state.used[state.sel]-=n; updateHud(); renderHint();

$('undoBtn').onclick=()=>{

    renderMix([`That's Undo. You have ${save.inv.undo} left, then they cost ${BOOSTERS.undo.price} coins.`,'good']);

  }

};
$('pickBtn').onclick=()=>{

$('drops').addEventListener('click',e=>{

$('retryBtn').onclick=()=>start(L.index);
$('nextBtn').onclick=()=>start(Math.min(L.index+1,LEVELS.length-1));
$('rescueBtn').onclick=rescue;
$('shareBtn').onclick=share;

function apply(){
  if(state.forced||state.finished) return;
  const r=current(),m=mix(counts()); if(!m) return;
  const p=matchPct(m,r.target);
  if(p<95){
    const chip=$('mixChip');chip.classList.remove('shake');void chip.offsetWidth;chip.classList.add('shake');
    renderMix([p+'% is not close enough. '+advice(m,r.target),'bad']);
    if(state.paint<=0) setTimeout(outOfPaint,700);
    return;
  }
  const used=state.used[r.id]||0;
  let s=used<=r.min?3:used<=r.min+2?2:1;
  if(state.hinted[r.id]||state.rescued[r.id]) s=Math.min(s,2);
  state.done[r.id]=true; state.stars[r.id]=s; state.applying=true; // locked until the next part is selected
  const g=scene.querySelector(`.region[data-id="${r.id}"]`);
  g.setAttribute(r.stroke?'stroke':'fill',hex(r.target)); g.classList.remove('sel'); g.classList.add('done');
  const cr=scene.querySelector(`.crack[data-for="${r.id}"]`); if(cr) cr.classList.add('gone');
  const gb=g.getBoundingClientRect();
  burst(gb.left+gb.width/2,gb.top+gb.height/2,[hex(r.target),hex(r.target),'#ffffff'],18,{speed:5,size:4,decay:.028,gravity:.12});
  const c=s*COINS_PER_STAR*TIERS[L.tier].mult; addCoins(c);
  toast(`${r.name} restored  ${'★'.repeat(s)}${'☆'.repeat(3-s)}  +${c} coins`);
  state.drops=[]; state.picking=false; state.hintMsg=null; updateHud(); renderHint();
  const next=L.regions.find(x=>!state.done[x.id]);
  if(!next){state.finished=true;finishPicture();}
  else if(state.paint<=0){select(next.id);setTimeout(outOfPaint,700);}
  else setTimeout(()=>select(next.id),350);
}

// ---------- Particles (paint drops, confetti, stars) ----------
const fxc=$('fx'), fx=fxc.getContext('2d'); let parts=[], fxRun=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeFx(){const d=devicePixelRatio||1;fxc.width=innerWidth*d;fxc.height=innerHeight*d;fx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',sizeFx); sizeFx();
function burst(x,y,colors,n,o={}){
  if(reduced) return;
  for(let i=0;i<n;i++){
    const a=o.angle!=null?o.angle+(Math.random()-.5)*(o.spread||1):Math.random()*Math.PI*2, sp=(o.speed||6)*(.5+Math.random());
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:(o.size||5)*(.6+Math.random()*.8),c:colors[i%colors.length],
      rot:Math.random()*6.3,vr:(Math.random()-.5)*.3,shape:o.shapes?o.shapes[i%o.shapes.length]:'drop',
      life:1,decay:(o.decay||.012)*(.7+Math.random()*.6),g:o.gravity??.18});
  }
  if(!fxRun){fxRun=true;requestAnimationFrame(tick);}
}
function tick(){
  fx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+60);
  for(const p of parts){
    p.vx*=.985; p.vy=p.vy*.985+p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=p.decay;
    fx.save(); fx.globalAlpha=Math.max(0,Math.min(1,p.life*2)); fx.translate(p.x,p.y);
    fx.fillStyle=p.c; fx.strokeStyle=INK; fx.lineWidth=1.5; const r=p.r;
    fx.beginPath();
    if(p.shape==='drop'){ // tip trails behind the direction of travel
      fx.rotate(Math.atan2(-p.vx,p.vy));
      fx.moveTo(0,-r*1.7); fx.bezierCurveTo(r*1.1,-r*.2,r,r,0,r); fx.bezierCurveTo(-r,r,-r*1.1,-r*.2,0,-r*1.7);
      fx.fill(); fx.stroke();
    }else if(p.shape==='star'){
      fx.rotate(p.rot); for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?r*.45:r*1.2;fx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
      fx.closePath(); fx.fill(); fx.stroke();
    }else if(p.shape==='rect'){
      fx.rotate(p.rot); fx.scale(1,Math.cos(p.rot*3)); fx.fillRect(-r,-r*.45,r*2,r*.9);
    }else{fx.arc(0,0,r,0,Math.PI*2); fx.fill(); fx.stroke();}
    fx.restore();
  }
  if(parts.length) requestAnimationFrame(tick); else {fxRun=false; fx.clearRect(0,0,innerWidth,innerHeight);}
}

// ---------- Picture complete: celebration ----------
function finishPicture(){
  const st=state; $('selLayer').innerHTML=''; renderMix();
  setTimeout(()=>{ if(state!==st) return; celebrate(st); setTimeout(()=>{if(state===st) win();},2400); },450);
}
function celebrate(st){
  const frame=document.querySelector('.frame');
  frame.classList.remove('celebrate'); void frame.offsetWidth; frame.classList.add('celebrate');
  // 1. light wave: regions flash left to right
  [...scene.querySelectorAll('.region')].map(g=>{const b=g.getBoundingClientRect();return {g,x:b.left+b.width/2};})
    .sort((a,b)=>a.x-b.x).forEach((o,i)=>{o.g.style.animationDelay=(i*80)+'ms';o.g.classList.remove('flash');void o.g.getBoundingClientRect();o.g.classList.add('flash');});
  // 2. shine sweep + twinkling sparkles
  let sp=''; for(let i=0;i<16;i++){const x=15+Math.random()*290,y=12+Math.random()*210,s=(.6+Math.random()*.9).toFixed(2);
    sp+=`<g transform="translate(${x|0} ${y|0}) scale(${s})"><path class="spark" style="animation-delay:${(300+Math.random()*1500)|0}ms" d="M0-9L2.2-2.2L9 0L2.2 2.2L0 9L-2.2 2.2L-9 0L-2.2-2.2Z"/></g>`;}
  $('fxLayer').innerHTML=`<defs><linearGradient id="shineG" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect class="shine" x="-150" y="-80" width="100" height="400" fill="url(#shineG)"/>`+sp;
  // 3. confetti in the picture's own colors: center pop, then two cannons from the bottom corners
  const cols=[...new Set(L.regions.map(r=>hex(r.target)))].concat(['#ffffff']);
  const fr=frame.getBoundingClientRect(), cx=fr.left+fr.width/2, cy=fr.top+fr.height/2;
  setTimeout(()=>{ if(state!==st) return;
    burst(cx,cy,cols,50,{speed:10,shapes:['drop','star','circle'],decay:.012,size:6});
    burst(0,innerHeight,cols,70,{angle:-Math.PI/2.7,spread:.7,speed:22,shapes:['rect','drop','star','rect'],decay:.005,gravity:.35,size:6});
    burst(innerWidth,innerHeight,cols,70,{angle:-Math.PI+Math.PI/2.7,spread:.7,speed:22,shapes:['rect','drop','star','rect'],decay:.005,gravity:.35,size:6});
  },400);
  // 4. "Restored" stamp slams onto the picture
  setTimeout(()=>{ if(state!==st) return; $('stamp').hidden=false; burst(cx,cy,[INK,'#ffffff'],26,{speed:8,shapes:['star'],decay:.03,size:5}); },1350);
}
function countUp(el,to){
  if(reduced||!to){el.textContent=to;return;}
  const t0=performance.now(), d=900;
  (function step(t){const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);})(t0);
}
function pictureStars(){return Math.max(1,Math.round(sumStars()/L.regions.length));}
function win(){
  const st=state, s=pictureStars(), last=L.index===LEVELS.length-1, first=save.best[L.id]==null;
  const total=sumStars(), max=L.regions.length*3;
  const bonus=(first?FIRST_CLEAR_BONUS:REPLAY_BONUS)*TIERS[L.tier].mult; addCoins(bonus);
  save.best[L.id]=Math.max(save.best[L.id]||0,s);
  const ch=save.challenge&&save.challenge.level===L.id?save.challenge:null, beaten=!!ch&&total>ch.score;
  if(beaten) save.challenge=null;
  persist(); renderMenu(); updateHud();
  $('endTitle').textContent=L.title+' restored';
  $('endStars').innerHTML=[0,1,2].map(i=>`<span class="${i<s?'':'off'}" style="animation-delay:${250+i*280}ms">★</span>`).join('');
  $('endText').innerHTML=`${total} / ${max}★  ·  +<b id="earnNum">0</b> <span class="coin"></span> earned  ·  ${state.paint} drops left`+
    (ch?(beaten?`<br><b>You beat ${esc(ch.from)}'s ${ch.score}★!</b>`:`<br>${esc(ch.from)} still leads: ${ch.score}★ vs your ${total}★. Replay to beat it.`):'')+
    (L.credit?`<br>${L.credit}.`:'')+(last?'<br>That was the last picture.':'');
  countUp($('earnNum'),state.earned);
  for(let i=0;i<s;i++) setTimeout(()=>{ if(state!==st) return; const b=$('endStars').children[i].getBoundingClientRect();
    burst(b.left+b.width/2,b.top+b.height/2,[INK,'#ffffff'],14,{speed:5,shapes:['star'],decay:.03,size:4,gravity:.1}); },450+i*280);
  if(beaten) setTimeout(()=>{ if(state===st) burst(innerWidth/2,innerHeight/3,[...new Set(L.regions.map(r=>hex(r.target)))],90,{speed:14,shapes:['rect','star','drop'],decay:.007,gravity:.25,size:6}); },900);
  // Share / challenge
  const proper=L.index>=FIRST_PROPER;
  $('shareBox').hidden=!proper;
  if(proper){
    state.shareCtx={total,max,ch,beaten}; state.shareFile=null;
    $('nameInput').value=save.name||'';
    $('shareNote').textContent=ch?(beaten?`Tell ${ch.from} you won.`:`Send ${ch.from} your score anyway?`):`Think a friend can beat ${total}★? Send them this picture.`;
    $('shareBtn').textContent=ch?'Send your score back':'Challenge a friend';
    makeShareFile(total,max).then(f=>{if(state===st) state.shareFile=f;}).catch(()=>{});
  }
  $('rescueBtn').hidden=true;
  $('endOverlay').classList.add('low');
  $('retryBtn').textContent='Replay';
  $('nextBtn').hidden=last;
  $('endOverlay').hidden=false;
}

// ---------- Sharing ----------
const EMOJI={'🟥':[.87,.18,.18],'🟧':[.96,.55,.13],'🟨':[.99,.83,.2],'🟩':[.33,.69,.3],'🟦':[.2,.5,.87],'🟪':[.6,.35,.75],'🟫':[.55,.35,.2],'⬛':[.15,.15,.15],'⬜':[.95,.95,.95]};
const emojiRow=()=>L.regions.map(r=>Object.keys(EMOJI).reduce((a,b)=>dE(EMOJI[a],r.target)<=dE(EMOJI[b],r.target)?a:b)).join('');
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
// Renders the restored picture as a 1080×1080 PNG card. Built ahead of time so the share tap stays a direct user gesture.
async function makeShareFile(total,max){
  const c=scene.cloneNode(true);
  c.querySelectorAll('#selLayer,#fxLayer,.crack').forEach(e=>e.remove());
  c.querySelectorAll('.region').forEach(g=>g.removeAttribute('style'));
  c.setAttribute('xmlns','http://www.w3.org/2000/svg'); c.setAttribute('width','960'); c.setAttribute('height','720');
  const load=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});
  const pic=await load('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c)));
  const logo=await load('img/logo-card.jpg').catch(()=>null);
  try{await document.fonts.load('700 60px Inter');}catch(e){}
  const W=1080,cv=document.createElement('canvas'); cv.width=cv.height=W; const x=cv.getContext('2d');
  x.fillStyle='#dfe3ea'; x.fillRect(0,0,W,W);
  if(logo) x.drawImage(logo,60,42,65,100);
  x.textBaseline='middle'; x.fillStyle=INK; x.font='700 64px Inter, sans-serif'; x.fillText('ColorFind',145,92);
  x.textAlign='right'; x.fillStyle=INK; x.font='700 40px Inter, sans-serif'; x.fillText(`★ ${total} / ${max}`,W-60,92);
  const X=48,Y=170,FW=984,FH=744;
  rr(x,X,Y+10,FW,FH,28); x.fillStyle=INK; x.fill();
  rr(x,X,Y,FW,FH,28); x.fillStyle='#fff'; x.fill(); x.lineWidth=8; x.strokeStyle=INK; x.stroke();
  x.save(); rr(x,X+12,Y+12,FW-24,FH-24,18); x.clip(); x.drawImage(pic,X+12,Y+12,FW-24,FH-24); x.restore();
  x.textAlign='center'; x.fillStyle=INK; x.font='700 46px Inter, sans-serif'; x.fillText(`${L.title} restored`,W/2,984);
  x.fillStyle='#646b80'; x.font='800 32px Inter, sans-serif'; x.fillText('Can you beat my score?',W/2,1036);
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  return new File([blob],`colorfind-${L.id}.png`,{type:'image/png'});
}
function share(){
  const name=$('nameInput').value.trim().slice(0,16); save.name=name; persist();
  const {total,max,ch,beaten}=state.shareCtx;
  const u=new URL(location.pathname,location.origin); u.searchParams.set('c',L.id); u.searchParams.set('s',total); if(name) u.searchParams.set('n',name);
  const link=u.href, row=emojiRow();
  const text=ch?(beaten?`I beat your ${ch.score}★! I got ${total}/${max}★ on "${L.title}" in ColorFind.\n${row}\nYour move.`
                      :`I got ${total}/${max}★ on "${L.title}" in ColorFind. You're still ahead with ${ch.score}★, for now.\n${row}`)
               :`I restored "${L.title}" in ColorFind with ${total}/${max}★\n${row}\nCan you beat me?`;
  const f=state.shareFile, fail=e=>{if(!e||e.name!=='AbortError') copyText(text+'\n'+link);};
  try{
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'ColorFind',text:text+'\n'+link}).catch(fail);return;}
    if(navigator.share){navigator.share({title:'ColorFind',text,url:link}).catch(fail);return;}
  }catch(e){}
  copyText(text+'\n'+link);
}
function copyText(t){
  const ok=()=>toast('Challenge copied. Paste it to your friend.'), no=()=>prompt('Copy this and send it to your friend:',t);
  try{navigator.clipboard.writeText(t).then(ok,no);}catch(e){no();}
}

function outOfPaint(){
  if(!state||!$('endOverlay').hidden||state.finished) return;
  const r=current(), ok=save.coins>=RESCUE_PRICE;
  $('endTitle').textContent='Out of paint';
  $('endStars').textContent='';
  $('endText').innerHTML=`You restored ${Object.keys(state.done).length} of ${L.regions.length} parts. `+
    (ok?`Restart the <b>${r.name}</b> with fresh paint and keep the rest of your work.`:`Restarting a part costs ${RESCUE_PRICE} coins. You have ${save.coins}.`);
  const rb=$('rescueBtn'); rb.hidden=false; rb.disabled=!ok;
  rb.innerHTML=`Restart ${r.name} · ${RESCUE_PRICE} <span class="coin"></span>`;
  $('shareBox').hidden=true;
  $('endOverlay').classList.remove('low');
  $('retryBtn').textContent='Start picture over';
  $('nextBtn').hidden=true;
  $('endOverlay').hidden=false;
}
// Pay coins to retry the current part: refund the paint spent on it, topped up so it is always winnable.
function rescue(){
  if(save.coins<RESCUE_PRICE) return;
  addCoins(-RESCUE_PRICE);
  const r=current();
  state.paint=Math.max(state.paint+(state.used[r.id]||0),r.min+4);
  state.used[r.id]=0; state.rescued[r.id]=true;
  $('endOverlay').hidden=true;
  updateHud(); select(r.id);
  toast(`${r.name} restarted. Paint refilled.`);
}
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800);}

goHome();
})();
</script>
