<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>ColorFind Mix</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#efeeea; --ink:#2a2c30; --muted:#8b8d92; --line:#e2e1dc; --track:#e6e5e0;
  --shadow:0 1px 2px rgba(30,30,35,.05),0 6px 20px rgba(30,30,35,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.35 "Manrope",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom))}

/* top bar: levels, level pot, life drops, coins */
.topbar{display:flex;align-items:center;gap:10px}
.iconbtn{appearance:none;border:0;background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.pot{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.pot .bar{flex:1;height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.pot .bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .2s}
.pot.life .bar i{background:var(--muted)}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);box-shadow:var(--shadow);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.15)}}
.dropico{display:inline-block;width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);flex:none;margin:0 1px}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2.5px var(--ink);flex:none}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:10px}
h1{margin:0;font:800 19px/1.2 "Manrope",system-ui,sans-serif}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.dots i.done{background:var(--ink)}
.dots i.cur{background:var(--panel);box-shadow:inset 0 0 0 2px var(--ink)}

/* circle with the target dot up-left */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 0}
.well{--d:min(42vh,84vw,420px);width:var(--d);height:var(--d);border-radius:50%;position:relative;
  background:#fff;box-shadow:0 0 0 1px var(--line),var(--shadow);transition:background-color .12s}
.well.empty{background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.well.dropping{box-shadow:0 0 0 3px var(--ink),var(--shadow)}
.dot{position:absolute;left:37%;top:37%;width:32.4%;height:32.4%;border-radius:50%;transform:translate(-50%,-50%)}
.well.win .dot{animation:pulse .9s ease-out}
.well.win{animation:ring 1.2s ease-out}
/* pour-out: the circle tips left, the paint drains with a level wavy surface and spills over the rim */
.well.pouring{animation:tilt .95s ease-in-out}
@keyframes tilt{0%{transform:rotate(0)}28%{transform:rotate(-18deg)}72%{transform:rotate(-18deg)}100%{transform:rotate(0)}}
.well.pouring .emptyhint{opacity:0}
.liqwrap{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.liqlevel{position:absolute;inset:-25%;animation:untilt .95s ease-in-out}
@keyframes untilt{0%{transform:rotate(0)}28%{transform:rotate(18deg)}72%{transform:rotate(18deg)}100%{transform:rotate(0)}}
.liq{position:absolute;inset:0;background:var(--c);animation:drain .8s cubic-bezier(.55,0,.8,.45) .12s both}
.liq svg{position:absolute;left:0;bottom:calc(100% - 1px);width:200%;height:12px;fill:var(--c);animation:wave .45s linear infinite}
@keyframes drain{from{transform:translateY(15%)}to{transform:translateY(102%)}}
@keyframes wave{to{transform:translateX(-50%)}}
.spill{position:fixed;left:0;top:0;border-radius:50% 50% 50% 0;pointer-events:none;z-index:9;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
@media (prefers-reduced-motion:reduce){.well.pouring,.liqlevel,.liq{animation:none}.liqwrap{display:none}}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 1px var(--line),0 0 0 0 rgba(42,44,48,.35)}100%{box-shadow:0 0 0 1px var(--line),0 0 0 24px rgba(42,44,48,0)}}
.emptyhint{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.paused{position:absolute;inset:0;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:14px;text-align:center;padding:0 18%}
.paused b{font-size:20px;color:var(--ink)}
.meterrow{width:min(var(--d,360px),340px);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meterrow .bar{flex:1;height:4px;border-radius:9px;background:var(--track);overflow:hidden}
.meterrow .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:9px;transition:width .15s}
.meterrow b{color:var(--ink);min-width:36px;text-align:right}
.timer{appearance:none;border:0;background:var(--panel);box-shadow:var(--shadow);border-radius:99px;padding:5px 10px 5px 8px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.timer .ico{width:16px;height:16px}
.timer.on{background:var(--ink);color:#fff}
.drops{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:18px;max-width:min(var(--d,360px),340px)}
.drops span{width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.drops.picking span{cursor:pointer;animation:wig .5s ease-in-out infinite;outline:2px dashed var(--ink);outline-offset:2px}
@keyframes wig{50%{transform:rotate(-45deg) scale(1.2)}}

/* paints */
.paints{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:var(--panel);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.paint{appearance:none;border:0;background:none;padding:0;display:flex;justify-content:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.paint .blob{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .1s}
.paint:active .blob{transform:scale(.9)}
.paint.hinted .blob{box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.paint:focus-visible .blob{outline:2px solid var(--ink);outline-offset:3px}
.ghost{position:fixed;left:0;top:0;width:48px;height:48px;border-radius:50%;pointer-events:none;z-index:8;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 10px 24px rgba(20,24,40,.2)}

/* boosters: same row as the main game */
.boosters{display:flex;justify-content:space-around;padding-top:14px}
.boost{appearance:none;border:0;background:none;padding:0;flex:0 0 68px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;cursor:pointer;position:relative;color:var(--ink)}
.boost .ico{width:48px;height:48px;padding:13px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 1px var(--line),var(--shadow);transition:transform .1s}
.boost:active .ico{transform:scale(.92)}
.boost.on .ico{background:var(--ink);color:#fff}
.boost:disabled{opacity:.4;cursor:default}
.boost.locked{color:var(--muted)}
.boost.locked .ico{background:var(--panel2);box-shadow:0 0 0 1px var(--line)}
.badge{position:absolute;top:-5px;left:calc(50% + 10px);background:var(--ink);color:#fff;border:2px solid var(--bg);border-radius:99px;padding:0 6px;font-size:11px;line-height:16px;font-weight:800;display:flex;align-items:center;gap:3px;white-space:nowrap}
.badge.buy{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.badge .coin{width:9px;height:9px;box-shadow:inset 0 0 0 2px var(--ink)}

/* toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:transform .25s;z-index:30;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:8px;text-align:center}
.toast.show{transform:translate(-50%,0)}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.toast .sw{box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.toast .dropico,.toast .coin{background:#fff}
.toast .coin{box-shadow:inset 0 0 0 2.5px var(--ink);outline:1px solid #fff}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(40,40,45,.25);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.low{align-items:flex-end;background:rgba(40,40,45,.12);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:420px;background:var(--panel);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto}
.card h2{margin:0;font:800 22px/1.2 "Manrope",system-ui,sans-serif}
.card p{margin:0;color:var(--muted);font-size:14px}
.card p b{color:var(--ink)}
.stars{color:var(--ink);font-size:24px;letter-spacing:4px}
.stars .off{color:var(--track)}
.recipe{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:99px;padding:5px 10px 5px 6px;font-size:13px;font-variant-numeric:tabular-nums}
.pair{display:flex;align-items:center;gap:12px}
.pair .big{width:56px;height:56px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.reward{display:flex;flex-wrap:wrap;gap:6px}
.reward span{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--panel2);border-radius:14px;padding:10px 4px;font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.booster{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.booster b{color:var(--ink)}
.acts{display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.primary,.secondary{appearance:none;border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:800;font-size:15px;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.primary{background:var(--ink);color:#fff}
.primary .coin{background:var(--ink);box-shadow:inset 0 0 0 2.5px #fff}
.primary .dropico{background:#fff}
.secondary{background:var(--panel2);color:var(--ink)}
.primary:disabled,.secondary:disabled{opacity:.4;cursor:default}
.lvlist{display:flex;flex-direction:column;gap:6px}
.lv{appearance:none;border:0;background:var(--panel2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;cursor:pointer}
.lv:disabled{opacity:.45;cursor:default}
.lv .n{width:34px;height:34px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:800}
.lv.done .n{background:var(--ink);color:#fff}
.lv .t{font-weight:700}
.lv .t small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.lv .r{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lv .r b{display:block;color:var(--ink);font-size:13px}
.adbox{height:140px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center}

@media (max-height:720px){ .well{--d:min(36vh,84vw)} .paint .blob{max-width:44px} .boost .ico{width:42px;height:42px;padding:10px} .boosters{padding-top:10px} }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" id="bMenu" aria-label="Уровни"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
    <div class="pot" id="pot" title="Капли уровня"><div class="bar"><i id="potFill"></i></div><span id="potVal">0</span></div>
    <div class="pill" id="lifePill" title="Запас капель"><span class="dropico"></span><span id="lifeVal">0</span></div>
    <div class="pill" id="coinPill" title="Монеты"><span class="coin"></span><span id="coinVal">0</span></div>
  </div>
  <header>
    <h1 id="lvTitle"></h1>
    <div class="dots" id="dots"></div>
  </header>

  <section class="stage">
    <div class="well empty" id="well">
      <div class="dot" id="dot"></div>
      <div class="emptyhint" id="emptyHint">Нажмите на краску</div>
      <div class="paused" id="paused" hidden><b>Пауза</b>Нажмите на таймер, чтобы продолжить</div>
    </div>
    <div class="meterrow">
      <button class="timer" id="bTimer" aria-label="Таймер, нажмите для паузы"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span id="timeVal">0:00</span></button>
      <span>Точность</span><div class="bar"><i id="accBar"></i></div><b id="accVal">—</b>
    </div>
    <div class="drops" id="drops"></div>
  </section>

  <section class="paints" id="paints"></section>
  <div class="boosters" id="boosters"></div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="ov" hidden><div class="card" id="card"></div></div>

<script>
// ---------- Color model (same subtractive CMY cube as index.html) ----------
const C={w:[1,1,1],c:[0,0.66,0.92],m:[0.89,0.07,0.52],y:[1,0.9,0.05],
  cm:[0.24,0.22,0.62],cy:[0.05,0.63,0.32],my:[0.93,0.18,0.14],cmy:[0.36,0.25,0.16]};
function cmy2rgb(c,m,y){
  const L=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  return L(L(L(C.w,C.y,y),L(C.m,C.my,y),m),L(L(C.c,C.cy,y),L(C.cm,C.cmy,y),m),c);
}
const PAINTS=[
  {k:'C',name:'Голубой',rgb:C.c},{k:'M',name:'Пурпурный',rgb:C.m},{k:'Y',name:'Жёлтый',rgb:C.y},
  {k:'W',name:'Белый',rgb:[0.98,0.98,0.97]},{k:'K',name:'Чёрный',rgb:[0.13,0.13,0.15]}];
const PK=PAINTS.map(p=>p.k), PMAP=Object.fromEntries(PAINTS.map(p=>[p.k,p]));
function mix(c){
  const Cy=c.C||0,M=c.M||0,Y=c.Y||0,W=c.W||0,K=c.K||0,total=Cy+M+Y+W+K; if(!total) return null;
  const ch=Cy+M+Y; let out=[0,0,0];
  if(ch){let v=[Cy/ch,M/ch,Y/ch];const m=Math.max(...v);v=v.map(x=>x/m);
    const base=cmy2rgb(...v);out=out.map((o,i)=>o+base[i]*ch/total);}
  return out.map((o,i)=>o+PMAP.W.rgb[i]*W/total+PMAP.K.rgb[i]*K/total);
}
const hex=rgb=>'#'+rgb.map(v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,'0')).join('');
function lab(rgb){
  const l=rgb.map(v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;
  const X=f((l[0]*0.4124+l[1]*0.3576+l[2]*0.1805)/0.95047),Y=f(l[0]*0.2126+l[1]*0.7152+l[2]*0.0722),Z=f((l[0]*0.0193+l[1]*0.1192+l[2]*0.9505)/1.08883);
  return [116*Y-16,500*(X-Y),200*(Y-Z)];
}
const dE=(a,b)=>{const A=lab(a),B=lab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);};
const matchPct=(a,b)=>Math.max(0,Math.round(100-dE(a,b)*1.1));
const WIN=96;               // match % needed to solve a task
const BOWL=12;              // max drops in the bowl; every recipe fits
const sum=r=>PK.reduce((s,k)=>s+(r[k]||0),0);
const shares=r=>{const t=sum(r);return Object.fromEntries(PK.map(k=>[k,t?(r[k]||0)/t:0]));};

// ---------- Economy ----------
// Drops are life. Each level has its own pot of drops (BUDGET_K × the recipes' total). When the pot runs dry,
// drops come out of the player's life reserve, which refills by one every LIFE_REGEN seconds up to LIFE_MAX.
// Drops left in the pot at the end of a level go back into the reserve. Coins come from stars and speed.
const LIFE_MAX=30, LIFE_REGEN=300, BUDGET_K=1.3;
const COINS_PER_STAR=3, FAST_SEC=30, FAST_BONUS=2, FIRST_CLEAR_BONUS=20, REPLAY_BONUS=5, START_COINS=50;
const LIFE_PACK={drops:15,price:30}, AD_DROPS=10;
const FREE_BOOSTERS=3;
const BOOSTERS={
  empty:{name:'Вылить',price:15,at:0,text:'Выливает всю миску и возвращает капли.'},
  undo:{name:'Отменить',price:20,at:0,text:'Убирает последнюю каплю и возвращает её.'},
  pick:{name:'Пипетка',price:30,at:1,text:'Нажмите её, затем любую каплю под кругом: эта капля уберётся и вернётся.'},
  hint:{name:'Подсказка',price:40,at:2,text:'Подсказывает следующий шаг. За цвет с подсказкой не больше 2★.'}};
const ICONS={
  empty:'<path d="M4 10h15a7.5 6.5 0 0 1-15 0Z"/><path d="M6.5 6.5 4.5 4"/><circle cx="3" cy="13.5" r="1.1"/>',
  undo:'<path d="M9 5 4 10l5 5"/><path d="M4 10h10a5 5 0 0 1 0 10h-3"/>',
  pick:'<path d="m14.5 3.5 6 6-2.5 2.5-6-6z"/><path d="m13 8-8.5 8.5V20h3.5l8.5-8.5"/>',
  hint:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3Z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'};
const icon=k=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
const COIN='<span class="coin"></span>', DROP='<span class="dropico"></span>';

// ---------- Levels ----------
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const rec=(keys,parts)=>Object.fromEntries(keys.map((k,i)=>[k,parts[i]]));
const combos=(arr,n)=>n===0?[[]]:arr.flatMap((x,i)=>combos(arr.slice(i+1),n-1).map(c=>[x,...c]));
const CMY=['C','M','Y'];

const SIMPLE=[[3,1],[4,1],[3,2],[2,1,1],[3,1,1],[2,2,1]];
const CX4=[[4,3,2,1],[5,3,2,1],[3,2,2,1],[5,2,2,1],[4,3,1,1],[3,3,2,1]];
const CX5=[[4,3,2,2,1],[5,3,2,1,1],[4,3,2,1,1],[3,3,2,2,1],[3,2,2,1,1]];  // ≤ BOWL drops

// A recipe must give a readable color: not near-black, K not dominant, and at least one chromatic paint.
function okRecipe(r){
  const s=shares(r); if(!CMY.some(k=>s[k]>0)) return false;
  if(s.K>0.4) return false;
  const L=lab(mix(r))[0]; return L>=20&&L<=96;
}
function randRecipe(pattern){
  for(let i=0;i<200;i++){
    const keys=shuffle(PK).slice(0,pattern.length), r=rec(keys,shuffle(pattern));
    if(okRecipe(r)) return r;
  }
  return {C:pattern[0],W:pattern[1]||1};
}
// Draw 7 mixed tasks whose colors are all visibly different.
function genMixed(lvl){
  const complex=Math.min(7,lvl-4), p5=Math.max(0,Math.min(1,(lvl-7)/5));
  const pats=[...Array(7-complex)].map(()=>pick(SIMPLE))
    .concat([...Array(complex)].map(()=>pick(Math.random()<p5?CX5:CX4)));
  const out=[];
  for(const p of pats){
    let best=null,bestD=-1;
    for(let i=0;i<60;i++){
      const r=randRecipe(p), c=mix(r), d=out.length?Math.min(...out.map(o=>dE(c,mix(o)))):99;
      if(d>bestD){best=r;bestD=d;} if(d>=12) break;
    }
    out.push(best);
  }
  return out; // simple first, complex last: difficulty rises inside the level
}

  if(n>0){save.life=Math.min(LIFE_MAX,save.life+n); save.lifeT=save.life>=LIFE_MAX?now:save.lifeT+n*LIFE_REGEN*1000; persist(); renderWallet();}

function startLevel(i){

  const fresh=Object.keys(BOOSTERS).filter(b=>BOOSTERS[b].at<=i&&save.inv[b]==null);
  fresh.forEach(b=>save.inv[b]=FREE_BOOSTERS); if(fresh.length) persist();
  loadTask();
  showCard(`<h2>Уровень ${i+1}: ${LEVELS[i].title}</h2><p>${LEVELS[i].text}</p>
    <p>Нажимайте на краски: каждое нажатие добавляет одну каплю. Смешайте цвет маленького круга. На уровень <b>${budget} капель</b>; когда они закончатся, капли пойдут из вашего запаса.</p>
    ${fresh.map(b=>`<div class="booster">${icon(b)}<div><b>${BOOSTERS[b].name}</b>: ${BOOSTERS[b].text} ${FREE_BOOSTERS} бесплатно, дальше ${BOOSTERS[b].price} ${COIN}</div></div>`).join('')}
    <div class="acts"><button class="primary" data-a="go">Начать</button></div>`,false,{go:()=>{closeCard();running=true;}});
}
function loadTask(){
  const r=tasks[ti]; task={recipe:r,target:mix(r),used:0,hinted:false};
  drops=[]; picking=false; hintShown=false;
  $('dot').style.background=hex(task.target);

  $('well').classList.remove('win');

function addDrop(k){
  if(solved||paused||!running) return false;
  if(drops.length>=BOWL){toast('Миска полна: уберите капли или вылейте миску');return false;}
  let life=false;
  if(pot>0) pot--;
  else{
    syncLife();
    if(save.life<=0){outOfDrops();return false;}
    save.life--; life=true; persist(); bump('lifePill');
    if(!potWarned){potWarned=true;toast(`Капли уровня закончились: теперь тратится запас ${DROP}`);}
  }
  drops.push({k,life}); task.used++; picking=false; hintShown=false; markPaint(null); update();
  if(matchPct(mix(counts()),task.target)>=WIN) finishTask();
  return true;
}
function refund(d){ if(d.life){save.life++;persist();} else pot++; }
function recipeHTML(r){
  return '<div class="recipe">'+PK.filter(k=>r[k]).map(k=>`<span class="chip">${swatch(k)}× ${r[k]}</span>`).join('')+'</div>';
}
const starsHTML=n=>'<div class="stars">'+[0,1,2].map(i=>i<n?'★':'<span class="off">★</span>').join('')+'</div>';
// As in the main game: 3★ within the recipe size, 2★ within +2 drops, else 1★; a hint caps it at 2★.
function starsFor(){
  const n=sum(task.recipe), s=task.used<=n?3:task.used<=n+2?2:1;
  return task.hinted?Math.min(2,s):s;
}
function finishTask(){
  solved=true; running=false; picking=false; markPaint(null);
  const stars=starsFor(), m=matchPct(mix(counts()),task.target);
  const fast=elapsed<FAST_SEC&&!task.hinted, coins=stars*COINS_PER_STAR+(fast?FAST_BONUS:0);
  results[ti]={stars,time:elapsed,coins}; addCoins(coins);
  $('well').classList.add('win'); renderDots(); update();
  const last=ti===tasks.length-1;
  setTimeout(()=>showCard(`
    <div class="pair"><div class="big" style="background:${hex(task.target)}"></div>

    ${recipeHTML(task.recipe)}
    <p>Время ${fmtTime(elapsed)} · капель ${task.used} (минимум ${sum(task.recipe)})</p>
    <div class="reward"><span>+${coins} ${COIN}</span>${fast?`<span>быстрее ${FAST_SEC} с: +${FAST_BONUS}</span>`:''}</div>
    <div class="acts"><button class="primary" data-a="next">${last?'Итоги уровня':'Дальше'}</button></div>`,true,
    {next:()=>{closeCard(); if(last) finishLevel(); else {ti++;loadTask();running=true;}}}),650);
}
function finishLevel(){
  const stars=results.reduce((s,r)=>s+r.stars,0), max=tasks.length*3, time=results.reduce((s,r)=>s+r.time,0);
  const prev=save.best[L], bonus=prev?REPLAY_BONUS:FIRST_CLEAR_BONUS;
  save.best[L]={stars:Math.max(stars,prev?.stars||0),time:Math.min(time,prev?.time??Infinity)};
  // Leftover level drops go back into the life reserve.
  syncLife(); const back=Math.max(0,Math.min(pot,LIFE_MAX-save.life)); save.life+=back; pot=0;
  addCoins(bonus);
  const hasNext=L<LEVELS.length-1;
  showCard(`<h2>Уровень ${L+1} пройден!</h2>
    <div class="stats"><div><b>${stars}/${max}</b>звёзд</div><div><b>${fmtTime(time)}</b>время</div><div><b>${fmtTime(time/tasks.length)}</b>в среднем</div></div>
    <div class="reward"><span>+${bonus} ${COIN} за уровень</span>${back?`<span>+${back} ${DROP} в запас</span>`:''}</div>
    ${prev?`<p>Рекорд: ${save.best[L].stars}/${max} ★ · ${fmtTime(save.best[L].time)}</p>`:''}
    <div class="acts"><button class="secondary" data-a="again">Ещё раз</button>${hasNext?'<button class="primary" data-a="next">Следующий</button>':'<button class="primary" data-a="menu">Уровни</button>'}</div>`,false,
    {again:()=>startLevel(L),next:()=>startLevel(L+1),menu:showLevels});

// ---------- Boosters ----------
const canUse=b=>save.inv[b]>0||save.coins>=BOOSTERS[b].price;
function spend(b){

}

// Pour-out animation: a copy of the paint drains out of the tipped circle and spills over its left rim,
// while the drops under the circle fall away.
function pourAnim(color){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const well=$('well'), r=well.getBoundingClientRect();
  const wrap=document.createElement('div'); wrap.className='liqwrap';
  wrap.innerHTML=`<div class="liqlevel"><div class="liq" style="--c:${color}"><svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M0 6Q25 0 50 6T100 6T150 6T200 6V12H0Z"/></svg></div></div>`;
  well.insertBefore(wrap,well.firstChild);
  well.classList.remove('pouring'); void well.offsetWidth; well.classList.add('pouring');
  const fall=(x,y,c,size,dx,dy,delay,dur)=>{
    const s=document.createElement('div'); s.className='spill';
    s.style.cssText=`width:${size}px;height:${size}px;background:${c}`;
    document.body.appendChild(s);
    const at=(fx,fy,sc)=>`translate(${x+fx-size/2}px,${y+fy-size/2}px) rotate(135deg) scale(${sc})`;
    s.animate([{transform:at(0,0,.4),opacity:0},{transform:at(dx*.15,dy*.03,1),opacity:1,offset:.12},
      {transform:at(dx*.6,dy*.3,1),opacity:1,offset:.5},{transform:at(dx,dy,.7),opacity:0}],
      {duration:dur,delay,easing:'cubic-bezier(.3,0,.9,.7)',fill:'both'}).onfinish=()=>s.remove();
  };
  // Stream over the rim: the tipped circle's lowest-left point.
  for(let i=0;i<22;i++)
    fall(r.left+r.width*.1,r.top+r.height*(.62+Math.random()*.12),color,6+Math.random()*9,
      -(20+Math.random()*80),140+Math.random()*200,240+i*22,620+Math.random()*260);
  // Drops under the circle drop out one after another.
  $('drops').querySelectorAll('span').forEach((d,i)=>{
    const b=d.getBoundingClientRect();
    fall(b.left+b.width/2,b.top+b.height/2,d.style.background,16,(Math.random()-.5)*30,90+Math.random()*60,i*35,520);
  });
  setTimeout(()=>{wrap.remove();well.classList.remove('pouring');},1150);
}
$('b_empty').onclick=()=>{

  pourAnim(hex(mix(counts())));
  const n=drops.length, all=drops; drops=[]; hintShown=false; markPaint(null);
  // As in the main game: with no booster and no coins the bowl is poured out without a refund.
  if(!canUse('empty')){update();toast(`Миска вылита, ${n} ${plural(n,['капля','капли','капель'])} потеряно`);return;}
  spend('empty'); all.forEach(refund); update(); toast('Миска вылита, капли вернулись');
};
$('b_undo').onclick=()=>{

};
$('b_pick').onclick=()=>{
  if(lockedMsg('pick')) return;

  if(!drops.length) return;

$('drops').addEventListener('click',e=>{

  refund(drops.splice(+s.dataset.i,1)[0]); picking=false; hintShown=false; markPaint(null); update();
});
// Hint = only the next useful step, as in the main game: a wrong paint to take out, or the next paint to add.
function nextHint(){
  const r=task.recipe, c=counts();
  const bad=Object.keys(c).find(k=>!r[k]);
  if(bad) return {k:bad,remove:true};
  let m=1; for(const k in c) m=Math.max(m,Math.ceil(c[k]/r[k]));
  if(m*sum(r)>BOWL) return {reset:true};
  let best=null,d=0; for(const k in r){const def=m*r[k]-(c[k]||0); if(def>d){d=def;best=k;}}
  return {k:best};
}
$('b_hint').onclick=()=>{
  if(lockedMsg('hint')||solved||!running||hintShown||!spend('hint')) return;
  const h=nextHint(); task.hinted=true; hintShown=true; renderBoosters();
  if(h.reset){markPaint(null);toast('Для этой пропорции капель слишком много: вылейте миску');return;}
  markPaint(h.remove?null:h.k);
  toast(h.remove?`Уберите ${swatch(h.k)} пипеткой или отменой`:`Добавьте ${swatch(h.k)}`);
};

// Drag and drop: press a paint, drag it onto the circle, let go to add a drop. A short press stays a tap.
(function(){
  let d=null;
  const overWell=(x,y)=>{const r=$('well').getBoundingClientRect(),m=20;return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m;};
  $('paints').addEventListener('pointerdown',e=>{
    const b=e.target.closest('.paint'); if(!b||b.disabled||e.button>0) return;
    d={k:b.dataset.k,x:e.clientX,y:e.clientY,ghost:null,id:e.pointerId}; dragged=false;
  });
  addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id) return;
    if(!d.ghost){
      if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<8) return;
      dragged=true;
      d.ghost=document.createElement('div'); d.ghost.className='ghost';
      d.ghost.style.background=hex(PMAP[d.k].rgb); document.body.appendChild(d.ghost);
    }
    d.ghost.style.transform=`translate(${e.clientX-24}px,${e.clientY-24}px)`;
    $('well').classList.toggle('dropping',overWell(e.clientX,e.clientY));
  });
  const end=e=>{
    if(!d||e.pointerId!==d.id) return;
    const g=d.ghost, k=d.k; d=null; $('well').classList.remove('dropping');
    if(!g) return;
    g.remove();
    if(e.type==='pointerup'&&overWell(e.clientX,e.clientY)) addDrop(k);
    setTimeout(()=>{dragged=false;},0);
  };
  addEventListener('pointerup',end); addEventListener('pointercancel',end);
})();

// Start: continue from the first level not yet cleared.
syncLife();
let first=LEVELS.findIndex((_,i)=>!save.best[i]); if(first<0) first=0;
startLevel(first);
</script>
</body>
